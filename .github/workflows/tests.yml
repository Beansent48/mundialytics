name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite
        run: pytest tests/ -q --disable-warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  # The images, so a Dockerfile cannot rot unnoticed between deployments.
  #
  # What is NOT built here, and why: the web image's final stage runs
  # `next build`, which prerenders every data page against a live API, and an
  # API is only ready with ~195 MB of data that git does not carry (it is
  # gitignored, and deliberately so). So CI builds the API image whole and the
  # web image up to `source` — `npm ci` against the committed lockfile plus the
  # sources, which is where a broken dependency or a typo in the Dockerfile
  # shows up. The `build` stage is exercised on the machine that has the data,
  # by the sequence in the README.
  images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image's dependency and source stages
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          target: source
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the compose file
        run: docker compose config --quiet
        env:
          BETTER_AUTH_SECRET: ci-only
