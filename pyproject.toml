[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mundialytics-betting-engine"
version = "0.50.0"
description = "Football prediction, player props, betting value and tournament simulation engine."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "requests>=2.31",
  "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
advanced = ["soccerdata>=1.8"]
