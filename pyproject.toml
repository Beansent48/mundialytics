[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mundialytics-betting-engine"
version = "0.52.0"
description = "Football match-prediction engine: calibrated 1X2, goal, half-time and prop markets, benchmarked against bookmaker closing odds."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "requests>=2.31",
  "joblib>=1.3",
  "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
data = ["soccerdata>=1.8"]
dev = ["pytest>=7.4", "matplotlib>=3.8"]
