runtime:
  timezone: Europe/Madrid
  default_cache_policy: cache_first
providers:
  oddspapi:
    enabled: true
    role: odds_provider
    mode: rapidapi
    rapidapi:
      key_env: RAPIDAPI_KEY
      host: odds-api1.p.rapidapi.com
      base_url: https://odds-api1.p.rapidapi.com
    direct:
      key_env: ODDSPAPI_API_KEY
      base_url: https://api.oddspapi.io
    limits:
      monthly_budget: 250
      max_calls_per_run: 25
      min_interval_sec: 0.35
    storage:
      cache_dir: data/raw/oddspapi/cache
      ledger_path: data/raw/oddspapi/request_ledger.jsonl
    defaults:
      sport_id: 10
      bookmaker: pinnacle
      snapshot_policy: pre_kickoff
      pre_kickoff_seconds: 3600
    endpoints:
      sports: /sports
      bookmakers: /bookmakers
      markets: /markets
      fixtures: /fixtures
      fixture_odds: /odds
      fixture_main_odds: /odds-by-tournaments
      fixture_historical_odds: /historical-odds
      fixture_clv: /clv
      tournaments: /tournaments
    primary_bookmaker: bet365
    bookmaker_strategy:
      training_reference:
      - bet365
      execution_reference:
      - bet365
      excluded:
      - bet365.de
      - betfair-ex
      - betfair-ex2
      - pinnacle
  creativesdev_live_football:
    enabled: true
    role: football_data_provider
    mode: rapidapi
    rapidapi:
      key_env: RAPIDAPI_KEY
      host: free-api-live-football-data.p.rapidapi.com
      base_url: https://free-api-live-football-data.p.rapidapi.com
    limits:
      monthly_budget: 100
      max_calls_per_run: 10
      min_interval_sec: 0.35
    storage:
      cache_dir: data/raw/creativesdev/cache
      ledger_path: data/raw/creativesdev/request_ledger.jsonl
    defaults:
      timezone: Europe/Madrid
      football_scope: soccer
    endpoints:
      fixtures_by_date:
        path: /football-get-matches-by-date
        params:
          date: '{date}'
      fixture_by_id:
        path: ''
        params:
          fixture_id: '{fixture_id}'
      fixture_lineups:
        path: ''
        params:
          fixture_id: '{fixture_id}'
      fixture_statistics:
        path: ''
        params:
          fixture_id: '{fixture_id}'
      fixture_events:
        path: ''
        params:
          fixture_id: '{fixture_id}'
      standings:
        path: ''
        params:
          league_id: '{league_id}'
          season: '{season}'
      odds_if_available:
        path: ''
        params:
          fixture_id: '{fixture_id}'
